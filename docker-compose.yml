name: house-rental-system

services:
  # ---------------------------------------------------------------------------
  # 1. SQL Server 2022 Database
  # ---------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: houserental-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-HouseRental@2026!}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\") > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - houserental-net

  # ---------------------------------------------------------------------------
  # 2. ASP.NET Core (.NET 10) Backend Web API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: APIDemo/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: houserental-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
      UseInMemoryDatabase: "false"
      AutoSeedDatabase: "${AUTO_SEED_DATABASE:-true}"
      DisableHttpsRedirection: "${DISABLE_HTTPS_REDIRECTION:-true}"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${SQL_DB_NAME:-APIDemo};User Id=sa;Password=${SQL_SA_PASSWORD:-HouseRental@2026!};TrustServerCertificate=True;Encrypt=True;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:-ChangeMe_SuperSecret_HouseRental_JwtKey_2026_Min32Chars!}"
      JwtSettings__Issuer: "${JWT_ISSUER:-http://localhost:5066}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-http://localhost:3000}"
      JwtSettings__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-15}"
      JwtSettings__RefreshTokenExpiryDays: "${JWT_REFRESH_EXPIRY_DAYS:-7}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost:3000}"
      Cors__AllowedOrigins__1: "http://127.0.0.1:${FRONTEND_PORT:-3000}"
    ports:
      - "${API_PORT:-5066}:8080"
    volumes:
      - api_uploads:/app/wwwroot/images
      - api_logs:/app/Logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - houserental-net

  # ---------------------------------------------------------------------------
  # 3. Next.js 16 Frontend Web App
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5066/api}"
        NEXT_PUBLIC_BACKEND_ORIGIN: "${NEXT_PUBLIC_BACKEND_ORIGIN:-http://localhost:5066}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
        NEXT_PUBLIC_ENABLE_DEMO_MODULES: "${NEXT_PUBLIC_ENABLE_DEMO_MODULES:-false}"
        NEXT_PUBLIC_IMAGE_UNOPTIMIZED: "${NEXT_PUBLIC_IMAGE_UNOPTIMIZED:-true}"
    container_name: houserental-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server Components (SSR) bên trong container gọi trực tiếp tới container API nội bộ
      INTERNAL_API_URL: "http://api:8080/api"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5066/api}"
      NEXT_PUBLIC_BACKEND_ORIGIN: "${NEXT_PUBLIC_BACKEND_ORIGIN:-http://localhost:5066}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      NEXT_PUBLIC_ENABLE_DEMO_MODULES: "${NEXT_PUBLIC_ENABLE_DEMO_MODULES:-false}"
      NEXT_PUBLIC_IMAGE_UNOPTIMIZED: "${NEXT_PUBLIC_IMAGE_UNOPTIMIZED:-true}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - houserental-net

volumes:
  sqlserver_data:
  api_uploads:
  api_logs:

networks:
  houserental-net:
    driver: bridge
